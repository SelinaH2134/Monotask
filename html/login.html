<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Log In | Monotask</title>

        <link rel="stylesheet" href="../css/styles.css">
    </head>

    <body>

        <main class="auth-page">

            <section class="auth-card">

                <div class="auth-header">
                    <a href="index.html" class="auth-logo">Monotask</a>

                    <h1>Welcome back</h1>

                    <p>Log in to continue organizing your assignments.</p>
                </div>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="loginEmail">Email</label>

                        <input type="email" id="loginEmail" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>

                        <input type="password" id="loginPassword" name="password" placeholder="Your password" required>
                    </div>

                    <button type="submit" class="primary-button auth-button">
                        Log In
                    </button>

                </form>

                <p class="auth-switch"> Don't have an account? <a href="signup.html">Create an account</a></p>

            </section>

        </main>

        <script src="../js/app.js"></script>

    </body>
</html>
