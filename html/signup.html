<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Sign Up | Monotask</title>

        <link rel="stylesheet" href="../css/styles.css">
    </head>

    <body>

        <main class="auth-page">

            <section class="auth-card">

                <div class="auth-header">
                    <a href="index.html" class="auth-logo">Monotask</a>

                    <h1>Create your account</h1>

                    <p>Start organizing your assignments in one place.</p>
                </div>

                <form id="signupForm">

                    <div class="form-group">
                        <label for="signupName">Name</label>

                        <input type="text" id="signupName" name="name" placeholder="Your name" required>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>

                        <input type="email" id="signupEmail" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>

                        <input type="password" id="signupPassword" name="password" placeholder="Create a password" required>
                    </div>

                    <div class="form-group">
                        <label for="signupSchoolLevel">Current school level</label>

                        <select id="signupSchoolLevel" name="schoolLevel" required>
                            <option value="" disabled selected>Select your school level</option>
                            <option value="High School Student">Middle School Student</option>
                            <option value="High School Student">High School Student</option>
                            <option value="College Student">College Student</option>
                            <option value="Graduate Student">Graduate Student</option>
                        </select>
                    </div>

                    <button type="submit" class="primary-button auth-button">
                        Create Account
                    </button>

                </form>

                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>

            </section>

        </main>

        <script src="../js/app.js"></script>

    </body>
</html>
